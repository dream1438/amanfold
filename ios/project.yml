# XcodeGen project: `brew install xcodegen && xcodegen` writes
# Amanfold.xcodeproj (not committed). Run scripts/build-core.sh first.
name: Amanfold
options:
  bundleIdPrefix: com.amanfold
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Set to the Apple Developer team to sign (xcodegen reads the env var).
    DEVELOPMENT_TEAM: ${AMANFOLD_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
packages:
  AmanfoldKit:
    path: AmanfoldKit
targets:
  Amanfold:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AmanfoldKit
        product: AmanfoldKit
      - target: AutoFill
        embed: true
    entitlements:
      path: App/Amanfold.entitlements
      properties:
        com.apple.security.application-groups: [group.com.amanfold.app]
        keychain-access-groups: [$(AppIdentifierPrefix)com.amanfold.shared]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Amanfold
        CFBundleLocalizations: [en, ar]
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: Unlock Amanfold with Face ID instead of typing your master password.
        AmanfoldKeychainGroup: $(AppIdentifierPrefix)com.amanfold.shared
        AmanfoldServer: https://api.amanfold.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amanfold.app
        # The bindings module is named Amanfold; the app module must not be.
        PRODUCT_MODULE_NAME: AmanfoldApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFill
    dependencies:
      - package: AmanfoldKit
        product: AmanfoldKit
      - sdk: AuthenticationServices.framework
    entitlements:
      path: AutoFill/AutoFill.entitlements
      properties:
        com.apple.security.application-groups: [group.com.amanfold.app]
        keychain-access-groups: [$(AppIdentifierPrefix)com.amanfold.shared]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    info:
      path: AutoFill/Info.plist
      properties:
        CFBundleDisplayName: Amanfold
        CFBundleLocalizations: [en, ar]
        NSFaceIDUsageDescription: Unlock Amanfold with Face ID instead of typing your master password.
        AmanfoldKeychainGroup: $(AppIdentifierPrefix)com.amanfold.shared
        AmanfoldServer: https://api.amanfold.com
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amanfold.app.autofill
        PRODUCT_MODULE_NAME: AmanfoldAutoFill
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Amanfold:
    build:
      targets:
        Amanfold: all
