<title>Amanfold Brand Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: oasis hero with the folding mark, sticky section nav, then numbered sections (numbers = the guide's real chapter order), each a label column + content column that stacks on phones */
:root{
  --bg:#F6F8F7; --surface:#FFFFFF; --sunken:#EDF2F0; --line:#DCE4E1; --fg:#13211F; --muted:#4F625E;
  --primary:#0F3B3A; --primary-h:#18514A; --on-primary:#FFFFFF; --accent:#E9A23B; --accent-text:#A2661A; --on-accent:#0B1716;
  --focus:#3B7D71; --ok:#1E7A50; --warn:#A35F00; --bad:#B93A27; --info:#2D64A3;
  --mk-l:#8DBAB0; --mk-d:#0F3B3A; --mk-s:#E9A23B; --mk-gap:var(--surface);
  --hero-bg:#0F3B3A; --hero-fg:#EEF6F4; --hero-muted:#B0D3CA;
  --digit:#A2661A; --sym:#3B7D71;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --text:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fold:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1716; --surface:#112220; --sunken:#081210; --line:#22403C; --fg:#E6EFEC; --muted:#9DB2AD;
  --primary:#8DBAB0; --primary-h:#B0D3CA; --on-primary:#061B1A; --accent:#EDAE4C; --accent-text:#F0BB62; --on-accent:#0B1716;
  --focus:#8DBAB0; --ok:#5CC495; --warn:#F0BB62; --bad:#F08A78; --info:#8DB8EA;
  --mk-l:#EEF6F4; --mk-d:#5E9A8E; --mk-s:#E9A23B;
  --hero-bg:#081210; --hero-fg:#EEF6F4; --hero-muted:#8DBAB0; --digit:#F0BB62; --sym:#8DBAB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1716; --surface:#112220; --sunken:#081210; --line:#22403C; --fg:#E6EFEC; --muted:#9DB2AD;
  --primary:#8DBAB0; --primary-h:#B0D3CA; --on-primary:#061B1A; --accent:#EDAE4C; --accent-text:#F0BB62; --on-accent:#0B1716;
  --focus:#8DBAB0; --ok:#5CC495; --warn:#F0BB62; --bad:#F08A78; --info:#8DB8EA;
  --mk-l:#EEF6F4; --mk-d:#5E9A8E; --mk-s:#E9A23B;
  --hero-bg:#081210; --hero-fg:#EEF6F4; --hero-muted:#8DBAB0; --digit:#F0BB62; --sym:#8DBAB0; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--text)}
[lang="ar"]{font-family:"IBM Plex Sans Arabic",var(--text);line-height:1.7}
code{font:13px/1.4 var(--mono);background:var(--sunken);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* mark */
.mk{display:block;overflow:visible}
.hero-mark{padding:18%}
.mk .fl{fill:var(--mk-l);stroke:var(--mk-l);stroke-width:2;stroke-linejoin:round}
.mk .fd{fill:var(--mk-d);stroke:var(--mk-d);stroke-width:2;stroke-linejoin:round}
.mk .seal{fill:var(--mk-s)}
.rev,.appicon,.tile.dark,.hero{--mk-l:#EEF6F4;--mk-d:#5E9A8E;--mk-s:#E9A23B}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.hero-in{max-width:1120px;margin:0 auto;padding-block:56px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center}
.hero-mark{display:grid;place-items:center}
.mk.big{width:min(300px,100%);height:auto;aspect-ratio:1}
.mk.big .fl,.mk.big .fd,.mk.big .seal{transform-box:view-box;transform-origin:32px 32px}
.mk.big .t{transform-origin:32px 8px}.mk.big .r{transform-origin:56px 32px}.mk.big .b{transform-origin:32px 56px}.mk.big .l{transform-origin:8px 32px}
.folding .mk.big .t{animation:inT 900ms var(--fold) both}
.folding .mk.big .r{animation:inR 900ms var(--fold) 120ms both}
.folding .mk.big .b{animation:inB 900ms var(--fold) 240ms both}
.folding .mk.big .l{animation:inL 900ms var(--fold) 360ms both}
.folding .mk.big .seal{animation:seal 520ms var(--fold) 900ms both}
@keyframes inT{from{transform:scaleY(-1)}to{transform:none}}
@keyframes inR{from{transform:scaleX(-1)}to{transform:none}}
@keyframes inB{from{transform:scaleY(-1)}to{transform:none}}
@keyframes inL{from{transform:scaleX(-1)}to{transform:none}}
@keyframes seal{0%{transform:scale(.2)}70%{transform:scale(1.12)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.folding .mk.big *{animation:none!important}}
.kicker{margin:0 0 18px;font:500 12.5px/1 var(--text);letter-spacing:.09em;text-transform:uppercase;color:var(--hero-muted)}
.hero h1{margin:0 0 20px}
.wm{display:block;fill:currentColor;height:auto}
.hero-wm{width:min(520px,100%)}
.tagline{margin:0;font:500 clamp(20px,2.6vw,28px)/1.35 var(--display);color:var(--hero-fg)}
.tagline.ar{margin-top:6px;color:var(--hero-muted);font-family:"Readex Pro",var(--display)}
.ghost{margin-top:28px;display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--hero-fg);border:1px solid rgb(255 255 255 / .25);border-radius:10px;padding:9px 14px;font:500 14px/1 var(--text);cursor:pointer}
.ghost:hover{border-color:rgb(255 255 255 / .5)}
.ghost .ic{width:16px;height:16px}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1120px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.nav a{flex:none;color:var(--muted);text-decoration:none;font:500 14px/1 var(--text);padding:9px 11px;border-radius:8px}
.nav a:hover{color:var(--fg);background:var(--sunken)}

/* sections */
main{max-width:1120px;margin:0 auto;padding-block:16px 80px}
.sec{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:40px;padding-block:56px;border-bottom:1px solid var(--line);scroll-margin-top:64px}
.sec-h{align-self:start;position:sticky;top:80px}
.num{margin:0 0 8px;font:500 13px/1 var(--mono);color:var(--accent-text)}
.sec h2{margin:0 0 12px;font:600 30px/1.15 var(--display);letter-spacing:-.01em}
.lede{margin:0;color:var(--muted);font-size:15px}
.sec-b{min-width:0;display:grid;gap:28px}
h3.sub{margin:8px 0 -8px;font:600 18px/1.3 var(--display)}
h4{margin:0 0 6px;font:600 16px/1.3 var(--display)}
.note{margin:0;color:var(--muted);font-size:14.5px;max-width:72ch}
.cap{margin:0;color:var(--muted);font-size:13.5px}
.two{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:32px;align-items:start}
.prose p{margin:0 0 14px;max-width:62ch}
.anatomy{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:18px}
.mk.anat{width:150px;height:150px;margin:0 auto}
.anatomy ol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14px}

/* logo */
.logo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{margin:0;border-radius:14px;padding:40px 28px 16px;display:grid;gap:28px;justify-items:center;align-content:space-between;min-height:200px;border:1px solid var(--line)}
.tile.light{background:#FFFFFF;color:#13211F;--mk-l:#8DBAB0;--mk-d:#0F3B3A}
.tile.dark{background:#0F3B3A;color:#FFFFFF;border-color:#0F3B3A}
.tile figcaption{font-size:12.5px;justify-self:stretch;color:inherit;opacity:.72}
.tile code{background:transparent;padding:0;color:inherit}
.lockup{display:flex;align-items:center;gap:14px}
.lockup .mk{width:54px;height:54px;flex:none;margin:-3px}
.lockup .wm{width:auto;height:32px;fill:currentColor}
.lockup[dir="rtl"] .wm{height:36px}
.lockup.sm .mk{width:34px;height:34px}.lockup.sm .wm{height:20px}.lockup.sm{gap:9px}
.tile.stack{gap:10px;justify-items:center}
.tile.stack>.mk{width:76px;height:76px}
.stk-lat .wm{height:24px;width:auto}.stk-ar .wm{height:28px;width:auto}
.tile.stack figcaption{margin-top:14px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rule{margin:0;display:grid;gap:12px;align-content:start}
.rule figcaption{font-size:14px;color:var(--muted)}
.rule b{color:var(--fg)}
.clear{position:relative;background:#FFFFFF;color:#13211F;--mk-l:#8DBAB0;--mk-d:#0F3B3A;border-radius:12px;padding:30px;display:grid;place-items:center;border:1px solid var(--line);background-image:linear-gradient(#FFFFFF,#FFFFFF),repeating-linear-gradient(45deg,#E9A23B33 0 6px,transparent 6px 12px);background-clip:content-box,padding-box}
.minsz{background:#FFFFFF;color:#13211F;--mk-l:#8DBAB0;--mk-d:#0F3B3A;border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;gap:36px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.minsz>span{display:grid;gap:8px;justify-items:center}
.minsz>span>.mk{width:16px;height:16px}
.minsz .lockup{gap:5px}.minsz .lockup .mk{width:18px;height:18px;margin:-1px}.minsz .lockup .wm{height:11px}
.minsz small{font:12px/1 var(--mono);color:#4F625E}
.donts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.donts li{display:grid;gap:10px;font-size:13.5px;color:var(--muted);align-content:start}
.dz{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;aspect-ratio:4/3;display:grid;place-items:center;max-width:100%}
.dz::after{content:"";position:absolute;inset:10px;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--bad) calc(50% - 1px),var(--bad) calc(50% + 1px),transparent calc(50% + 1px));opacity:.55;pointer-events:none}
.dz .mk{width:64px;height:64px}
.mk.x-rot{transform:rotate(45deg)}
.mk.x-col{--mk-l:#7C5CFF;--mk-d:#2B79FF;--mk-s:#FF4D6D}
.mk.x-str{transform:scaleX(1.6) scaleY(.75)}
.x-lock{grid-template-columns:auto auto;gap:6px;place-content:center}
.pad{width:34px;height:34px;fill:none;stroke:var(--fg);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* app icon */
.appicon{display:inline-grid;place-items:center;background:linear-gradient(#ffffff12,#00000018),#0F3B3A;border-radius:22.5%;aspect-ratio:1;flex:none}
.appicon .mk{width:58%;height:58%}
.icon-row{display:grid;gap:20px}
.phone-row{display:grid;gap:10px}
.homescreen{display:flex;gap:22px;flex-wrap:wrap;padding:26px 24px;border-radius:16px;background:linear-gradient(135deg,#C9D8D3,#7FA79D 55%,#3E6C64);justify-content:center}
.homescreen .app{display:grid;gap:6px;justify-items:center;color:#FFFFFF;font-size:12px;text-shadow:0 1px 2px #0006}
.homescreen .appicon,.homescreen .ph{width:64px;height:64px}
.ph{display:block;border-radius:22.5%}
.p1{background:conic-gradient(from 30deg,#F7B32B,#E76F51,#8E7DBE,#2A9D8F,#F7B32B)}.p2{background:linear-gradient(#5AA9E6,#2F6FD0)}.p3{background:linear-gradient(135deg,#9ED29A,#E8F1E4 60%,#F2D27A)}
.sizes{display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.s120{width:120px}.s64{width:64px}.s40{width:40px}.s28{width:28px}.s24{width:24px}.s16{width:16px}
.tabbar{display:flex;gap:2px;background:var(--sunken);border:1px solid var(--line);border-radius:12px 12px 0 0;padding:8px 8px 0;overflow:hidden}
.tab{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--surface);border-radius:8px 8px 0 0;font-size:13px;white-space:nowrap;min-width:0}
.tab.dim{background:transparent;color:var(--muted)}

/* colour */
.scale{display:grid;gap:10px}
.scale-h{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.scale-h h4{margin:0}.scale-h p{margin:0;font-size:14px;color:var(--muted)}
.chips{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.chips li.brand{box-shadow:inset 0 0 0 3px currentColor}
.chips li{padding:10px 8px 9px;min-width:0;display:grid;gap:22px;min-height:84px;align-content:space-between}
.chips b{font:600 13px/1 var(--text);display:flex;gap:6px;align-items:center}
.chips code{background:transparent;padding:0;font-size:10.5px;letter-spacing:-.02em;color:inherit;opacity:.85}
.tag{font:600 9.5px/1 var(--text);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:99px;padding:3px 5px}
.sem ul{list-style:none;margin:8px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sem li{display:flex;gap:10px;align-items:center;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sem li code{margin-left:auto;font-size:11px}
.sem p{margin:0;color:var(--muted);font-size:14px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dot{background:var(--cd)}}
:root[data-theme="dark"] .dot{background:var(--cd)}
.seal-rule{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
.seal-rule p{margin:0;color:var(--muted);font-size:14.5px;max-width:60ch}
.srv{display:grid;gap:10px;justify-items:center}.srv .mk{width:56px;height:56px}
.pill-s{background:var(--accent);color:var(--on-accent);font:600 12.5px/1 var(--text);padding:7px 11px;border-radius:99px;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:14px}
caption{text-align:left;font:600 14px/1.4 var(--display);padding-bottom:8px;caption-side:top}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-weight:600;color:var(--muted);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.contrast td:not(:first-child){font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.tok th{width:150px;font-weight:600;white-space:nowrap}
.files th{width:auto}

/* type */
.faces{display:grid;gap:14px}
.face{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 24px;display:grid;gap:6px}
.role{margin:0;font:500 12px/1 var(--text);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.spec{margin:4px 0 0;font-size:15px;font-weight:600}
.spec.d{font-family:var(--display)}.spec.m{font-family:var(--mono)}
.pair{margin:0;max-width:100%}
.pair.d{font:500 clamp(26px,3.6vw,38px)/1.25 "Readex Pro",var(--display)}
.pair.d [lang="ar"]{font-family:"Readex Pro",var(--display);display:inline-block}
.pair.t{font-size:18px;line-height:1.6}
.pw{margin:4px 0;font:500 clamp(20px,3vw,28px)/1.2 var(--mono);letter-spacing:.06em;overflow-wrap:anywhere;font-variant-numeric:slashed-zero}
.pw .n{color:var(--digit)}.pw .y{color:var(--sym)}
.meta{margin:0;color:var(--muted);font-size:14px;max-width:68ch}
.scale-t{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 24px;overflow:hidden}
.scale-t>div{display:flex;gap:16px;align-items:baseline;min-width:0}
.scale-t .sz{font:12px/1 var(--mono);color:var(--muted);width:24px;flex:none}
.scale-t span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ts48{font:600 48px/1.15 var(--display)}.ts36{font:600 36px/1.2 var(--display)}.ts28{font:600 28px/1.25 var(--display)}.ts22{font:500 22px/1.3 var(--display)}
.ts18{font:500 18px/1.4 var(--text)}.ts16{font:400 16px/1.5 var(--text)}.ts14{font:400 14px/1.5 var(--text);color:var(--muted)}.ts12{font:600 12px/1.4 var(--text);letter-spacing:.08em}

/* voice */
.principles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.principles li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.principles p{margin:0;color:var(--muted);font-size:14.5px}
.dodont{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.col{border-radius:14px;padding:18px 20px;border:1px solid var(--line);display:grid;gap:10px;align-content:start}
.col p{margin:0;font-size:15px}
.col.do{background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.col.dont{background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.col.dont p{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent);color:var(--muted)}
.lines{display:grid;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.line{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1fr);gap:20px;padding:14px 20px;border-top:1px solid var(--line);font-size:14.5px}
.line:first-child{border-top:0}
.line p{margin:0}
.ctx{font:600 12px/1.6 var(--text);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.taglines{background:var(--hero-bg);color:var(--hero-fg);border-radius:14px;padding:24px 28px;display:grid;gap:8px}
.taglines h4{color:var(--hero-muted);font:500 12px/1 var(--text);letter-spacing:.08em;text-transform:uppercase}
.tg{margin:0;font:500 clamp(22px,3vw,30px)/1.35 "Readex Pro",var(--display);display:grid;gap:4px}
.tg span{color:var(--hero-muted);font-family:"Readex Pro",var(--display)}
.taglines .note{color:var(--hero-muted)}

/* icons */
.icons{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.icons li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 8px 10px;display:grid;gap:10px;justify-items:center;font:12px/1.2 var(--mono);color:var(--muted);text-align:center}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icons .ic{width:28px;height:28px;color:var(--fg)}

/* ui */
.ui-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ui-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px;align-content:start;min-width:0}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.b{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 16px;font:500 14.5px/1.2 var(--text);border:1px solid transparent;cursor:pointer}
.b .ic{width:18px;height:18px}
.b.primary{background:var(--primary);color:var(--on-primary)}.b.primary:hover{background:var(--primary-h)}
.b.secondary{background:var(--surface);color:var(--fg);border-color:var(--line)}
.b.quiet{background:transparent;color:var(--primary);padding-inline:8px}
.b.seal{background:var(--accent);color:var(--on-accent);font-weight:600}
.b.sm{padding:7px 12px;font-size:13px}
.fld{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.fld input{font:15px/1.3 var(--text);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld input.mono{font-family:var(--mono);font-variant-numeric:slashed-zero}
.pwrow{display:flex;gap:8px}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;flex:none}
.iconbtn .ic{width:20px;height:20px}
.items{list-style:none;margin:0;padding:0;display:grid}
.items li{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);min-width:0}
.items li:first-child{border-top:0}
.fav{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:600 15px/1 var(--display);flex:none;color:#fff;background:#24292F}
.fav .ic{width:20px;height:20px}
.fav.c{background:#0F3B3A}.fav.n{background:var(--sunken);color:var(--fg)}.fav.b2{background:#1E7A50}
.it{display:grid;min-width:0;flex:1}
.it b{font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;gap:5px;align-items:center;font:500 12px/1 var(--text);color:var(--muted);background:var(--sunken);border-radius:99px;padding:5px 9px}
.chip .ic{width:14px;height:14px}
.msg{margin:0;display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:10px}
.msg .ic{width:18px;height:18px;margin-top:1px}
.msg.ok{background:color-mix(in srgb,var(--ok) 11%,transparent);color:var(--ok)}
.msg.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}
.msg.bad{background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad)}
.beta{display:inline-block;font:600 11.5px/1 var(--text);letter-spacing:.06em;text-transform:uppercase;color:var(--primary);border:1px dashed currentColor;border-radius:99px;padding:6px 10px}
.beta.sm{font-size:10px;padding:4px 7px}

/* mocks */
.mock-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.mock{margin:0;display:grid;gap:10px;justify-items:center;min-width:0}
.mock figcaption{font-size:13.5px;color:var(--muted);text-align:center}
.popup,.phone{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 32px rgb(6 27 26 / .14);padding:14px;display:grid;gap:12px}
.pp-h{display:flex;align-items:center;gap:8px}
.pp-logo{display:flex;align-items:center;gap:8px;margin-inline-end:auto;font:500 17px/1 var(--display)}
.pp-logo .mk{width:26px;height:26px}
.pp-h .iconbtn{width:32px;height:32px}
.pp-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--muted)}
.pp-search .ic{width:18px;height:18px}
.pp-search input{border:0;background:transparent;font:14px var(--text);color:var(--fg);padding:9px 0;flex:1;min-width:0}
.pp-site{margin:0;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.pp-site .ic{width:16px;height:16px}
.pp-foot{border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
.pp-foot span{display:flex;gap:6px;align-items:center}.pp-foot .ic{width:15px;height:15px;color:var(--accent-text)}
.phone{border-radius:28px;padding:14px 16px 10px;gap:12px}
.ph-status{display:flex;justify-content:space-between;font:600 12px/1 var(--text);color:var(--muted);padding:2px 6px}
.ph-h{display:flex;align-items:center;justify-content:space-between}
.ph-h h5{margin:0;font:600 26px/1.2 "Readex Pro",var(--display)}
.cats{display:flex;gap:6px;overflow:hidden}
.cats span{font-size:13px;padding:6px 12px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.cats .on{background:var(--primary);color:var(--on-primary)}
.paycard{position:relative;aspect-ratio:1.586;border-radius:14px;background:linear-gradient(135deg,#18514A,#0A2B2A);color:#EEF6F4;padding:16px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto auto;overflow:hidden;--mk-l:#fff}
.pc-fold{position:absolute;top:0;left:0;width:38px;height:38px;background:linear-gradient(135deg,var(--surface) 50%,#E9A23B 50%);border-bottom-right-radius:6px;box-shadow:2px 2px 6px rgb(0 0 0 / .25)}
[dir="ltr"] .pc-fold{left:auto;right:0;background:linear-gradient(225deg,var(--surface) 50%,#E9A23B 50%);border-bottom-left-radius:6px;border-bottom-right-radius:0}
.pc-brand{grid-column:1;grid-row:1;font:700 italic 18px/1 var(--text);letter-spacing:.02em;justify-self:start}
.pc-num{grid-column:1/3;grid-row:3;font:500 17px/1 var(--mono);letter-spacing:.08em;justify-self:start;direction:ltr}
.pc-name{grid-column:1;grid-row:4;font-size:13px;opacity:.85;margin-top:8px}
.pc-exp{grid-column:2;grid-row:4;font:13px var(--mono);opacity:.85;margin-top:8px}
.ph-tabs{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px}
.ph-tabs span{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted)}
.ph-tabs .ic{width:20px;height:20px}
.ph-tabs .on{color:var(--primary)}
.mock.wide{justify-items:stretch}
.site{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 8px 32px rgb(6 27 26 / .1)}
.site-n{display:flex;align-items:center;gap:20px;padding:14px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.site-n .links{display:flex;gap:18px;font-size:14px;color:var(--muted);margin-inline-start:auto}
.site-n .lang{font-size:13px;color:var(--muted)}
.site-hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:28px;padding:44px 32px;align-items:center;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--mk-l) 22%,transparent),transparent 60%)}
.sh-copy{display:grid;gap:16px;justify-items:start}
.sh-copy h3{margin:0;font:600 clamp(28px,4vw,44px)/1.12 var(--display);letter-spacing:-.015em;text-wrap:balance}
.sh-copy p{margin:0;color:var(--muted);max-width:52ch}
.sh-art{display:grid;place-items:center}
.mk.site-mk{width:min(220px,100%);height:auto;aspect-ratio:1}

@media (max-width:900px){
  .hero-in,.sec,.two,.site-hero{grid-template-columns:1fr}
  .hero-in{gap:28px;padding-block:40px 44px}
  .mk.big{width:200px}
  .sec{gap:20px;padding-block:44px}.sec-h{position:static}
  .donts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .line{grid-template-columns:1fr;gap:6px}
}
@media (max-width:640px){
  .chips{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr))}
  .logo-grid,.rules,.principles,.dodont,.ui-grid,.mock-row{grid-template-columns:1fr}
  .seal-rule{grid-template-columns:1fr}
  .site-n .links{display:none}
  .site-hero{padding:28px 20px}
  .sh-art{display:none}
  .lockup .mk{width:40px;height:40px}.lockup .wm{height:24px}.lockup[dir="rtl"] .wm{height:27px}
  .tile{padding:28px 16px 14px}
  .ts48{font-size:34px}.ts36{font-size:28px}
}
</style>
