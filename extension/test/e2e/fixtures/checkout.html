<!doctype html>
<html><head><meta charset="utf-8"><title>Checkout</title>
<style>iframe { width: 360px; height: 120px; border: 1px solid #ccc; display:block; }</style></head><body>
  <h1>Shop</h1>
  <form>
    <label>Name on card <input id="cc-name" name="ccname"></label>
    <label>Card number <input id="cc-num" name="cardnumber" inputmode="numeric"></label>
    <label>Expiry month <select id="cc-month" name="exp-month">
      <option value="">MM</option><option value="01">01</option><option value="02">02</option><option value="03">03</option>
      <option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option>
      <option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
    </select></label>
    <label>Expiry year <select id="cc-year" name="exp-year"><option value="">YYYY</option><option>2026</option><option>2027</option><option>2028</option><option>2029</option></select></label>
    <label>CVV <input id="cc-cvv" name="cvv" maxlength="4"></label>
  </form>
  <iframe id="pay" src="http://pay.com:__PORT__/frame-card.html"></iframe>
</body></html>
