# Amanfold production stack: sync server + Caddy (automatic HTTPS) + backups.
# Run from this folder on the server:  docker compose up -d
# Settings come from ./.env (copy env.example). See docs/DEPLOY.md.
name: amanfold

services:
  server:
    image: ${AMANFOLD_IMAGE:-ghcr.io/dream1438/amanfold-server:latest}
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    command: ["serve"]
    environment:
      AMANFOLD_LISTEN: 0.0.0.0:8080
      AMANFOLD_DB: /data/amanfold.db
      AMANFOLD_SECRETS_FILE: /run/secrets/amanfold
      AMANFOLD_TRUST_PROXY: "1"
      AMANFOLD_SMTP_URL: ${AMANFOLD_SMTP_URL:?set AMANFOLD_SMTP_URL in .env}
      AMANFOLD_MAIL_FROM: ${AMANFOLD_MAIL_FROM:?set AMANFOLD_MAIL_FROM in .env}
      AMANFOLD_ALLOWED_ORIGINS: ${AMANFOLD_ALLOWED_ORIGINS:-}
      AMANFOLD_SITE_URL: ${AMANFOLD_SITE_URL:-https://amanfold.com}
      RUST_LOG: ${RUST_LOG:-info}
      SQLITE_TMPDIR: /tmp
    secrets:
      - amanfold
    volumes:
      - data:/data
    # Reachable only from the host's loopback, where Caddy listens.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [server]
    # Host networking: Caddy sees every client's real IPv4 and IPv6 address
    # (Docker's port publishing would replace IPv6 clients with the bridge
    # gateway, so they would all share one rate-limit budget).
    network_mode: host
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.amanfold.com}
      SITE_DOMAIN: ${SITE_DOMAIN:-amanfold.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  backup:
    build: ./backup
    restart: unless-stopped
    cap_drop: [ALL]
    # Read the server-owned database and key file; cron changes to root.
    cap_add: [DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY in .env}
      RESTIC_PASSWORD_FILE: /run/secrets/restic
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-17 * * * *}
    secrets:
      - amanfold
      - restic
    volumes:
      - data:/data
      # SFTP (Hetzner Storage Box): key created by scripts/install.sh.
      - ./secrets/ssh:/root/.ssh:ro
    logging: *logging

volumes:
  data:
  caddy_data:
  caddy_config:

secrets:
  amanfold:
    file: ./secrets/amanfold-secrets.json
  restic:
    file: ./secrets/restic-password
