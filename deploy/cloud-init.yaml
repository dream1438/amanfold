#cloud-config
# Paste this into "Cloud config / User data" when creating the server
# (Ubuntu 26.04 LTS or 24.04 LTS). It hardens SSH, turns on the firewall and automatic
# security updates, installs Docker and fetches the deploy files to
# /opt/amanfold. Log in afterwards with:  ssh root@<server IP>
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - git
  - ufw
  - fail2ban
  - unattended-upgrades
  - sqlite3

write_files:
  - path: /etc/ssh/sshd_config.d/10-amanfold.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      MaxAuthTries 3
  - path: /etc/apt/apt.conf.d/52amanfold-upgrades
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "5" }, "live-restore": true }

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - systemctl restart ssh
  - systemctl enable --now docker fail2ban unattended-upgrades
  - git clone https://github.com/dream1438/amanfold.git /opt/amanfold
  - cp /opt/amanfold/deploy/env.example /opt/amanfold/deploy/.env
  - chmod 600 /opt/amanfold/deploy/.env
