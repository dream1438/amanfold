[workspace]
resolver = "3"
members = ["crates/amanfold-core"]

# Argon2 and its BLAKE2 hash are always optimised, so tests run with the
# real production KDF settings instead of weakened ones.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
