name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy -p amanfold-wasm --all-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --all-features
      - run: PROPTEST_CASES=2000 cargo test -p amanfold-core --release
      - run: cargo build -p amanfold-core --target wasm32-unknown-unknown --release

  # Generated Python and Kotlin bindings, driven end to end against the
  # test server (the Android app uses the Kotlin bindings).
  bindings-linux:
    runs-on: ubuntu-latest
    env:
      KOTLIN_VERSION: "2.2.21"
      KOTLIN_SHA256: a623871f1cd9c938946948b70ef9170879f0758043885bbd30c32f024e511714
      JNA_VERSION: "5.17.0"
      JNA_SHA256: b3a9408e7c51e08ef0e3bfcc08f443f6ec0f6191ba8cd7c18d53d2b22e5bdbc0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p amanfold-ffi --features test-server
      - name: Generate bindings
        run: |
          for lang in python kotlin; do
            cargo run -q -p uniffi-bindgen -- generate --no-format \
              --library target/debug/libamanfold_ffi.so --language $lang --out-dir out/$lang
          done
      - name: Python
        run: |
          cp target/debug/libamanfold_ffi.so out/python/
          PYTHONPATH=out/python python3 crates/amanfold-ffi/tests/bindings/test_flow.py
      - name: Kotlin
        run: |
          curl -sSfL -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          curl -sSfL -o jna.jar "https://repo.maven.apache.org/maven2/net/java/dev/jna/jna/${JNA_VERSION}/jna-${JNA_VERSION}.jar"
          echo "${KOTLIN_SHA256}  kotlin.zip" | sha256sum -c -
          echo "${JNA_SHA256}  jna.jar" | sha256sum -c -
          unzip -q kotlin.zip -d kotlin
          kotlin/kotlinc/bin/kotlinc out/kotlin/com/amanfold/core/amanfold.kt \
            crates/amanfold-ffi/tests/bindings/FlowTest.kt -cp jna.jar -d flow.jar
          java -Djna.library.path=target/debug \
            -cp flow.jar:jna.jar:kotlin/kotlinc/lib/kotlin-stdlib.jar FlowTestKt

  # Generated Swift bindings (iOS and macOS apps), compiled and run on macOS.
  bindings-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p amanfold-ffi --features test-server
      - name: Generate and run
        run: |
          cargo run -q -p uniffi-bindgen -- generate --no-format \
            --library target/debug/libamanfold_ffi.dylib --language swift --out-dir out/swift
          cp crates/amanfold-ffi/tests/bindings/FlowTest.swift out/swift/main.swift
          cd out/swift
          swiftc -module-name AmanfoldTest -emit-executable -o flow \
            -Xcc -fmodule-map-file=AmanfoldFFI.modulemap -I . \
            -L ../../target/debug -lamanfold_ffi \
            Amanfold.swift main.swift
          DYLD_LIBRARY_PATH=../../target/debug ./flow

  # WebAssembly bindings (browser extension, web vault), run under Node.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-bindgen (same version as the crate pins)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Shipping build (no test server)
        run: |
          cargo build -p amanfold-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --out-dir pkg-web target/wasm32-unknown-unknown/release/amanfold_wasm.wasm
          ls -l pkg-web
          ! grep -q TestServer pkg-web/amanfold_wasm.d.ts
      - name: End-to-end test
        run: |
          cargo build -p amanfold-wasm --features test-server --target wasm32-unknown-unknown --release
          wasm-bindgen --target nodejs --out-dir pkg target/wasm32-unknown-unknown/release/amanfold_wasm.wasm
          node crates/amanfold-wasm/tests/flow.cjs pkg

  # Browser extension: type check, unit tests, and the end-to-end test in
  # Chromium against a real amanfold-server. Uploads the store zips.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install wasm-bindgen (same version as the crate pins)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: npm run wasm
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Store packages
        run: node scripts/build.mjs --zip
      - uses: actions/upload-artifact@v4
        with:
          name: amanfold-extension
          path: extension/dist/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: extension/test-results/

  # The end-to-end test in a real Firefox (preinstalled on the runner, with
  # geckodriver), driven by selenium-webdriver.
  extension-firefox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install wasm-bindgen (same version as the crate pins)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: npm run wasm
      - run: firefox --version && geckodriver --version
      - run: FIREFOX="$(command -v firefox)" npm run e2e:firefox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-firefox
          path: extension/test-results/

  # The Chrome build in other Chromium-based browsers. Edge is preinstalled on
  # the runner; the others come from their makers' package repositories.
  extension-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [edge, brave, vivaldi, opera]
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install wasm-bindgen (same version as the crate pins)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Install ${{ matrix.browser }}
        run: |
          set -eu
          key() { curl -fsSL "$1" | gpg --dearmor | sudo tee "/usr/share/keyrings/$2.gpg" >/dev/null; }
          case "${{ matrix.browser }}" in
            edge)
              bin="$(command -v microsoft-edge || command -v microsoft-edge-stable)" ;;
            brave)
              sudo curl -fsSLo /usr/share/keyrings/brave.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/brave.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave.list
              sudo apt-get update -q && sudo apt-get install -yq brave-browser
              bin=/usr/bin/brave-browser ;;
            vivaldi)
              key https://repo.vivaldi.com/archive/linux_signing_key.pub vivaldi
              echo "deb [signed-by=/usr/share/keyrings/vivaldi.gpg] https://repo.vivaldi.com/archive/deb/ stable main" | sudo tee /etc/apt/sources.list.d/vivaldi.list
              sudo apt-get update -q && sudo apt-get install -yq vivaldi-stable
              bin=/usr/bin/vivaldi-stable
              # Vivaldi's own interface is extension pages, which Playwright
              # can't attach to: the shorter raw-DevTools test, with a window
              # on a virtual display.
              echo "E2E_SCRIPT=e2e:smoke" >> "$GITHUB_ENV"
              echo "HEADED=1" >> "$GITHUB_ENV" ;;
            opera)
              key https://deb.opera.com/archive.key opera
              echo "deb [signed-by=/usr/share/keyrings/opera.gpg] https://deb.opera.com/opera-stable/ stable non-free" | sudo tee /etc/apt/sources.list.d/opera.list
              sudo apt-get update -q && sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq opera-stable
              bin=/usr/bin/opera
              echo "E2E_CDP=1" >> "$GITHUB_ENV"
              echo "HEADED=1" >> "$GITHUB_ENV" ;;
          esac
          "$bin" --version || true
          echo "E2E_BROWSER=$bin" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run wasm
      # Opera aborts without the GNOME settings schemas; both want a D-Bus session.
      - run: sudo apt-get install -yq gsettings-desktop-schemas dbus-x11
      - run: xvfb-run -a dbus-run-session -- npm run "${E2E_SCRIPT:-e2e}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.browser }}
          path: extension/test-results/

  # Safari on macOS and iOS: wrap the Safari build in its native app and
  # compile it (unsigned; the App Store needs an Apple Developer account).
  extension-safari:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install wasm-bindgen (same version as the crate pins)
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: npm run wasm
      - run: node scripts/build.mjs
      - run: sh scripts/safari.sh

  # Android app: the shared client's tests on the JVM against a real
  # amanfold-server, then the app itself (Rust core per ABI via cargo-ndk).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Client tests (JVM, real server)
        run: ./gradlew :client:test --console=plain
      - name: Build the app
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: amanfold-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/client/build/reports/
            android/app/build/reports/

  # iOS app: AmanfoldKit's tests on macOS against a real amanfold-server,
  # then the app and its AutoFill extension for the simulator (unsigned).
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build the core for Apple platforms
        run: ios/scripts/build-core.sh
      - name: Build the test server
        run: cargo build -p amanfold-server
      - name: AmanfoldKit tests (real server)
        env:
          AMANFOLD_SERVER_BIN: ${{ github.workspace }}/target/debug/amanfold-server
        run: swift test --package-path ios/AmanfoldKit
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build for the simulator
        run: |
          cd ios
          xcodebuild -project Amanfold.xcodeproj -scheme Amanfold -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 200
          test "${PIPESTATUS[0]}" -eq 0

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Reviewed exception, see .cargo/audit.toml and docs/SECURITY.md (O10).
          ignore: RUSTSEC-2026-0387
